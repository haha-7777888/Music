start_1 : "<blockquote><b>{0} သည် အလုပ်လုပ်နေဆဲ ဖြစ်သည်</b> \n\n<b>⏱ အသုံးပြုချိန် :</b> {1}\n\n<b>/play</b> နှင့် သီချင်းအမည်ကို ပို့ပြီး သီချင်းစတင်လိုက်ပါ 🎶</blockquote>"
start_2 : "<blockquote expandable><b>ဟေး {0}</b> \n\n<b>{1}</b> မှ ကြိုဆိုပါတယ် — တယ်လီဂရမ် ဗီဒီယိုချတ်များအတွက် သင့်ရဲ့ ကိုယ်ပိုင်သီချင်းဖော်။ သီချင်းအမည် (သို့) လင့်ခ်ကို ပို့ပြီး စက္ကန့်ပိုင်းအတွင်း သီချင်းစတင်လိုက်ပါ \n\n<b> ဖွင့်နိုင်သော အရာများ</b>\n• <b>YouTube</b> — သီချင်းများ၊ ဗီဒီယိုများနှင့် ပလေးလစ်များ\n• <b>Spotify</b> — တေးသွားများ၊ အယ်လ်ဘမ်များနှင့် ပလေးလစ်များ\n\nအမိန့်ခိုဏ်းအားလုံးကို ကြည့်ရန် အောက်ပါ <b>Help</b> ခလုတ်ကို နှိပ်ပါ </blockquote>"
start_3 : "<blockquote><b>ဟေး {0}</b> \n\n<b>{2}</b> တွင် <b>{1}</b> ကို ထည့်သွင်းပေးသည့်အတွက် ကျေးဇူးတင်ပါတယ် 🎉\n\n<b>{3}</b> သည် ဤချတ်သို့ သီချင်းများ ယူဆောင်လာရန် အဆင်သင့်ဖြစ်နေပါပြီ။ ဗီဒီယိုချတ် စတင်ပြီး <b>/play</b> နှင့် သီချင်းအမည်ကို ပို့ပါ 🎶</blockquote>"
start_4 : " <b>စူပါဂရု လိုအပ်သည်</b> \n\nကျေးဇူးပြု၍ သင့်<b>အုပ်စု</b>ကို <b>စူပါဂရု</b>သို့ ပြောင်းလဲပြီးမှ ကျွန်ုပ်ကို ထပ်ထည့်ပါ။\n\n<b>စူပါဂရု ဘങ്ങനെလုပ်ရမလဲ?</b>\n- သင့်အုပ်စု၏ ချတ်မှတ်တမ်းကို တစ်ကြိမ် <b>မြင်ရအောင်</b> ပြုလုပ်ပါ။"
start_5 : "<b>↝ ပိတ်ပင်ထားသော ချတ် ↜</b>\n\nဤချတ်သည် {0} ဒေတာဘေ့စ်တွင် ပိတ်ပင်ထားသည်။\nချတ်ပိတ်ပင်ချက် ဖြုတ်ရန် <a href={1}>Sudo အသုံးပြုသူ</a> ကို တောင်းဆိုပါ (သို့) <a href={2}>ပံ့ပိုးမှုချတ်</a> သို့ ဝင်ရောက်ပါ။"
start_6 : "💻 <b>သီချင်း အချက်အလက်</b> 💻\n\n📌 <b>ခေါင်းစဉ် :</b> {0}\n\n⏳ <b>ကြာချိန် :</b> မိနစ် {1}\n👀 <b>ကြည့်ရှုသူ :</b> <code>{2}</code>\n⏰ <b>တင်င်သည့်ရက် :</b> {3}\n📎 <b>ချန်နယ် :</b> <a href={4}>{5}</a>\n\n<u><b> ရှာဖွေမှု အထောက်အကူပြု {6}</b></u>"

help_1 : "<blockquote expandable><b>💻 အကူအညီ စင်တာ</b>\n\n⌨️ အမိန့်ခိုဏ်းများကို ကြည့်ရန် အောက်ပါ အမျိုးအစားကို ရွေးချယ်ပါ။\n\nအခက်အခဲရှိပါက <a href={0}>ပံ့ပိုးမှုချတ်</a> တွင် မေးမြန်းပါ 💬\n\n<b>အကြံပြုချက် :</b> အမိန့်ခိုဏ်းတိုင်းသည် <code>/</code> ဖြင့် အလုပ်လုပ်သည်</blockquote>"
help_2 : "<blockquote><b>📖 အကူအညီ လိုအပ်ပါသလား?</b>\n\nအောက်ပါခလုတ်ကို နှိပ်ပြီး အကူအညီ မီနူးအပြည့်အစုံကို သင့် PM သို့ တိုက်ရိုက်ရယူပါ 📩</blockquote>"

