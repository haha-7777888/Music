setting_5 : "» အုပ်စု : အမိန့်ပေးသော အုပ်စုတွင် သီချင်းဖွင့်သည်။\n\n» ချန်နယ် : သင်လိုချင်သော ချန်နယ်တွင် သီချင်းဖွင့်သည်။ /channelplay ဖြင့် ချန်နယ်အိုင်ဒီ သတ်မှတ်ပါ။"
